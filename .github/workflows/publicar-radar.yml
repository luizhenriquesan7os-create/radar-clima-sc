name: Atualizar e publicar Radar Clima SC

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '17 11,14,17,20,23 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: radar-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar PNCP e gerar painel
        run: python radar_pncp.py --days 2 --uf SC --out site --stateless
      - name: Preparar página inicial
        run: cp site/radar_ultimo.html site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
